<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Farm Ledger — Livestock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --parchment: #F1ECDC;
    --parchment-alt: #E8E0C8;
    --ink: #232B22;
    --ink-soft: #5B6355;
    --primary: #2F4A38;
    --primary-dark: #1E3226;
    --accent: #C98A2C;
    --accent-soft: #E8C77E;
    --accent-dark: #9C6A1F;
    --alert: #A6432F;
    --alert-soft: #F0D9CF;
    --good: #3F7A56;
    --good-soft: #DCEBE1;
    --warn: #B8790F;
    --warn-soft: #F5E3C2;
    --border: #CBB78E;
    --rustic-olive: #6F7D3C;
    --rustic-olive-dark: #58642F;
    --rustic-soil: #7A5230;
    --rustic-soil-dark: #603F26;
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--parchment-alt);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    overflow-x: hidden;
  }
  h1, h2, h3, .font-display { font-family: 'Roboto Slab', serif; margin: 0; }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  p, span, td, th, li { overflow-wrap: break-word; word-break: break-word; }
  .content-panel { background: var(--parchment); padding: 24px 20px 60px; }
  @media (min-width: 760px) {
    .content-panel {
      background: var(--parchment);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 34px rgba(35,43,34,0.10);
      margin-top: 22px;
      margin-bottom: 22px;
      padding: 32px 40px 60px;
    }
  }
  .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-dark); font-weight: 600; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 3px rgba(35,43,34,0.05); }
  .card-flat { background: rgba(255,255,255,0.55); border: 1px solid var(--border); border-radius: 12px; }
  .ear-tag {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px 4px 22px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .ear-tag::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: currentColor;
    opacity: 0.55;
  }
  .tag-neutral { background: rgba(232,199,126,0.4); color: var(--accent-dark); border: 1px solid rgba(201,138,44,0.35); }
  .tag-healthy { background: rgba(47,74,56,0.1); color: var(--primary); border: 1px solid rgba(47,74,56,0.3); }
  .tag-attention { background: var(--alert-soft); color: var(--alert); border: 1px solid rgba(166,67,47,0.4); }
  .tag-sold { background: rgba(35,43,34,0.05); color: var(--ink-soft); border: 1px solid var(--border); }
  .tag-deceased { background: rgba(35,43,34,0.05); color: var(--ink-soft); border: 1px solid var(--border); }
  .tag-compliant { background: var(--good-soft); color: var(--good); border: 1px solid rgba(63,122,86,0.35); }
  .tag-due { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(184,121,15,0.35); }
  .tag-overdue { background: var(--alert-soft); color: var(--alert); border: 1px solid rgba(166,67,47,0.4); }
  .tag-open { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(184,121,15,0.35); }
  .tag-resolved { background: var(--good-soft); color: var(--good); border: 1px solid rgba(63,122,86,0.35); }
  input, select, textarea {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    padding: 10px 14px;
    color: var(--ink);
    outline: none;
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder, textarea::placeholder { color: rgba(91,99,85,0.55); }
  .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 11px 18px; font-weight: 500; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: var(--primary); color: var(--parchment); border: none; border-radius: 8px; padding: 11px 18px; font-weight: 500; }
  .btn-secondary:hover { background: var(--primary-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); border-radius: 8px; padding: 11px 18px; font-weight: 500; }
  .btn-outline:hover { background: rgba(255,255,255,0.6); }
  button { transition: box-shadow .15s ease, transform .15s ease, filter .15s ease, background-color .15s ease; }
  .tile-lift:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(35,43,34,0.22); filter: brightness(1.03); }
  .btn-primary:hover, .btn-secondary:hover, .btn-quick:hover { transform: translateY(-1px); }
  .btn-quick { color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-weight: 500; font-size: 13px; }
  .btn-quick-issue { background: var(--alert); }
  .btn-quick-issue:hover { background: #8A3626; }
  .btn-quick-event { background: var(--rustic-olive); }
  .btn-quick-event:hover { background: var(--rustic-olive-dark); }
  .btn-quick-inspection { background: var(--accent); }
  .btn-quick-inspection:hover { background: var(--accent-dark); }
  .btn-quick-transaction { background: var(--rustic-soil); }
  .btn-quick-transaction:hover { background: var(--rustic-soil-dark); }
  .btn-danger-text { background: none; border: none; color: var(--alert); font-size: 13px; font-weight: 500; padding: 4px 2px; }
  .btn-link-text { background: none; border: none; color: var(--primary); font-size: 13px; font-weight: 500; padding: 4px 2px; }
  .row-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .topnav-link { padding: 9px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; border: none; background: transparent; color: var(--parchment); opacity: 0.85; white-space: nowrap; text-align: left; }
  .topnav-link.active { background: var(--parchment); color: var(--primary); opacity: 1; }
  .checklist-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .checklist-row:first-child { border-top: none; }
  .checklist-row input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }
  .heat-table { border-collapse: collapse; width: 100%; min-width: 420px; }
  .heat-table th { text-align: center; padding: 6px 10px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .heat-table td { padding: 0; text-align: center; }
  .heat-cell { margin: 3px; padding: 10px 4px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; }
  #print-root { display: none; }
  @media print {
    body.printing > *:not(#print-root) { display: none !important; }
    body.printing #print-root { display: block !important; position: static; padding: 24px; background: #fff; color: #111; }
    body.printing #print-root table { width: 100%; border-collapse: collapse; }
    body.printing #print-root th, body.printing #print-root td { border-bottom: 1px solid #ccc; padding: 6px 8px; font-size: 12px; text-align: left; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function() {
  var SPECIES = [
    { id: 'cattle', label: 'Cattle', icon: '🐄', tracking: 'individual', unit: 'head', prodLabel: 'Milk (L/day)', prodKey: 'milkL', color: '#6B4A32' },
    { id: 'sheep', label: 'Sheep', icon: '🐑', tracking: 'individual', unit: 'head', prodLabel: 'Wool (kg/shear)', prodKey: 'woolKg', color: '#7C6A46' },
    { id: 'goats', label: 'Goats', icon: '🐐', tracking: 'individual', unit: 'head', prodLabel: 'Milk (L/day)', prodKey: 'milkL', color: '#9C6A1F' },
    { id: 'pigs', label: 'Pigs', icon: '🐖', tracking: 'individual', unit: 'head', prodLabel: 'Last litter size', prodKey: 'litterSize', color: '#A85C72' },
    { id: 'chickens', label: 'Chickens', icon: '🐔', tracking: 'flock', unit: 'birds', prodLabel: 'Eggs / day', prodKey: 'eggsPerDay', color: '#C98A2C' },
    { id: 'ducks', label: 'Ducks', icon: '🦆', tracking: 'flock', unit: 'birds', prodLabel: 'Eggs / day', prodKey: 'eggsPerDay', color: '#3E7C8C' }
  ];

  var CROPS = [
    { id: 'vegetables', label: 'Vegetables', icon: '🥬', tracking: 'crop', unit: 'beds', prodLabel: 'Last yield (kg)', prodKey: 'yieldKg', color: '#3F7A56' },
    { id: 'maize', label: 'Maize', icon: '🌽', tracking: 'crop', unit: 'hectares', prodLabel: 'Last yield (kg)', prodKey: 'yieldKg', color: '#B8860B' },
    { id: 'fruit', label: 'Fruit trees', icon: '🍎', tracking: 'crop', unit: 'trees', prodLabel: 'Last yield (kg)', prodKey: 'yieldKg', color: '#A6432F' }
  ];

  var INSPECTION_TEMPLATE = [
    'Water troughs clean and functioning',
    'Fencing and gates secure',
    'Feed and mineral stock adequate',
    'General body condition and welfare check',
    'Mortality or losses recorded and investigated',
    'Medicine and vaccine records up to date',
    'Predator or pest signs checked',
    'Fire and emergency equipment checked'
  ];

  var SECURITY_TEMPLATE = [
    'Perimeter fencing walked and checked for breaks or weak sections',
    'Electric fence energiser powered on and voltage tested',
    'All gates closing properly and locking mechanisms working',
    'Padlocks, chains and keys accounted for, no signs of tampering',
    'Security cameras powered on, recording and lenses unobstructed',
    'Alarm system armed overnight and test-triggered',
    'Yard and building lighting working after dark',
    'No signs of forced entry, cut fencing or trespassing',
    'Vehicles, equipment and tools locked away or accounted for',
    'Outstanding repairs from last check followed up'
  ];

  var ALL_SPECIES_IDS = SPECIES.map(function(s) { return s.id; });
  var DEFAULT_SPECIES_IDS = ALL_SPECIES_IDS.concat(['vegetables']);
  var STORAGE_KEY = 'farm-ledger-state-v1';

  function speciesById(id) { return SPECIES.concat(CROPS).filter(function(s){ return s.id === id; })[0]; }
  function fmtR(n) { return (n < 0 ? '-R' : 'R') + Math.round(Math.abs(n)).toLocaleString(); }
  function todayStr() { return new Date().toISOString().slice(0,10); }
  function confirmDelete(label) { return window.confirm('Delete ' + label + '? This cannot be undone.'); }
  function hexToRgb(hex) { hex = hex.replace('#',''); var n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function heatBg(value, max, hex) {
    var rgb = hexToRgb(hex);
    var t = max > 0 ? Math.min(1, value / max) : 0;
    var alpha = value > 0 ? (0.16 + 0.72 * t) : 0.06;
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha.toFixed(2) + ')';
  }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

  var state = {
    farm: { farmName: 'Smart Design', ownerName: '', speciesIds: DEFAULT_SPECIES_IDS.slice() },
    animals: [],
    issues: [],
    compliance: [],
    inspections: [],
    securityChecks: [],
    workers: [],
    contacts: [],
    grazingLogs: [],
    waterLogs: [],
    loadSheddingLogs: [],
    stockItems: [],
    stockMoves: [],
    farmFinance: [],
    view: { page: 'dashboard' },
    menuOpen: false,
    counters: {},
    uiTabs: { compliance: 'Outstanding', stock: 'Inventory', finance: 'Overview', issues: 'Open', insights: 'Activity', dashboardChart: 'Farm activity', records: 'Workers' },
    meta: {}
  };

  function nextId(prefix) {
    state.counters[prefix] = (state.counters[prefix] || 0) + 1;
    return prefix.toUpperCase() + '-' + String(state.counters[prefix]).padStart(3, '0');
  }

  function seedData(speciesIds) {
    // Clean demo build: no sample records — every list starts empty so a
    // prospective client sees a genuine blank slate rather than fictional data.
    return {
      animals: [], issues: [], compliance: [], inspections: [], securityChecks: [],
      stockItems: [], stockMoves: [], farmFinance: [],
      workers: [], contacts: [], grazingLogs: [], waterLogs: [], loadSheddingLogs: []
    };
  }

  // ---------- persistence ----------
  function serializableState() {
    return {
      farm: state.farm, animals: state.animals, issues: state.issues, compliance: state.compliance,
      inspections: state.inspections, securityChecks: state.securityChecks, stockItems: state.stockItems, stockMoves: state.stockMoves,
      farmFinance: state.farmFinance, counters: state.counters, meta: state.meta,
      workers: state.workers, contacts: state.contacts, grazingLogs: state.grazingLogs,
      waterLogs: state.waterLogs, loadSheddingLogs: state.loadSheddingLogs
    };
  }

  function hasStorage() { return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }

  function ensureIndicator() {
    var ind = document.getElementById('save-indicator');
    if (!ind) {
      ind = document.createElement('div');
      ind.id = 'save-indicator';
      ind.style.cssText = 'position:fixed;bottom:16px;right:16px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:500;box-shadow:0 2px 10px rgba(35,43,34,0.18);z-index:80;transition:opacity .3s;font-family:"Work Sans",sans-serif;';
      document.body.appendChild(ind);
    }
    return ind;
  }

  function setIndicator(status) {
    var ind = ensureIndicator();
    ind.style.opacity = '1';
    if (status === 'loading') { ind.textContent = 'Loading your farm…'; ind.style.background = 'var(--parchment-alt)'; ind.style.color = 'var(--ink-soft)'; }
    else if (status === 'saving') { ind.textContent = 'Saving…'; ind.style.background = 'var(--warn-soft)'; ind.style.color = 'var(--warn)'; }
    else if (status === 'saved') { ind.textContent = '✓ Saved'; ind.style.background = 'var(--good-soft)'; ind.style.color = 'var(--good)'; setTimeout(function(){ ind.style.opacity = '0'; }, 1400); }
    else if (status === 'offline') { ind.textContent = 'Session only — not saved to your account'; ind.style.background = 'var(--parchment-alt)'; ind.style.color = 'var(--ink-soft)'; setTimeout(function(){ ind.style.opacity = '0'; }, 2600); }
    else { ind.textContent = 'Could not save — will retry'; ind.style.background = 'var(--alert-soft)'; ind.style.color = 'var(--alert)'; }
  }

  var saveTimer = null;
  function scheduleSave() {
    if (!hasStorage()) { setIndicator('offline'); return; }
    setIndicator('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() {
      window.storage.set(STORAGE_KEY, JSON.stringify(serializableState()), false).then(function(res) {
        setIndicator(res ? 'saved' : 'error');
      }).catch(function() { setIndicator('error'); });
    }, 550);
  }

  // ---------- Live weather (Open-Meteo, no API key required) ----------
  var weatherState = { status: 'idle', data: null, locationLabel: '' };

  function weatherCodeInfo(code) {
    var map = {
      0: ['☀️', 'Clear'], 1: ['🌤️', 'Mostly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
      45: ['🌫️', 'Fog'], 48: ['🌫️', 'Fog'],
      51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌦️', 'Dense drizzle'],
      61: ['🌧️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'],
      71: ['🌨️', 'Light snow'], 73: ['🌨️', 'Snow'], 75: ['❄️', 'Heavy snow'],
      80: ['🌦️', 'Rain showers'], 81: ['🌦️', 'Rain showers'], 82: ['⛈️', 'Violent showers'],
      95: ['⛈️', 'Thunderstorm']
    };
    return map[code] || ['🌡️', 'Weather'];
  }

  function fetchWeather() {
    if (weatherState.status === 'loading') return;
    weatherState.status = 'loading';
    if (state.view.page === 'dashboard') render();

    function runFetch(lat, lon, label) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&forecast_days=3';
      fetch(url).then(function(res) { return res.json(); }).then(function(data) {
        if (!data || !data.daily) throw new Error('bad response');
        weatherState.status = 'loaded';
        weatherState.data = data;
        weatherState.locationLabel = label;
        if (state.view.page === 'dashboard') render();
      }).catch(function() {
        weatherState.status = 'error';
        if (state.view.page === 'dashboard') render();
      });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) { runFetch(pos.coords.latitude.toFixed(3), pos.coords.longitude.toFixed(3), 'Your location'); },
        function() { runFetch(-29.8587, 31.0218, 'Durban, South Africa'); },
        { timeout: 6000 }
      );
    } else {
      runFetch(-29.8587, 31.0218, 'Durban, South Africa');
    }
  }

  function renderWeatherStrip() {
    var wrap = el('div', { style: 'display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;background:var(--card-flat-bg, rgba(255,255,255,0.5));border:1px solid var(--border);margin-bottom:22px;overflow-x:auto;' });

    if (weatherState.status === 'idle' || weatherState.status === 'loading') {
      wrap.appendChild(el('span', { text: '🌤️', style: 'font-size:16px;flex-shrink:0;' }));
      wrap.appendChild(el('span', { text: 'Fetching live forecast…', style: 'color:var(--ink-soft);font-size:12.5px;' }));
      return wrap;
    }
    if (weatherState.status === 'error' || !weatherState.data) {
      wrap.appendChild(el('span', { text: '🌤️', style: 'font-size:16px;flex-shrink:0;' }));
      wrap.appendChild(el('span', { text: 'Couldn\u2019t load live weather.', style: 'color:var(--ink-soft);font-size:12.5px;flex:1;' }));
      var retryBtn = el('button', { class: 'btn-link-text', text: 'Retry', style: 'font-size:12.5px;flex-shrink:0;' });
      retryBtn.addEventListener('click', function() { fetchWeather(); });
      wrap.appendChild(retryBtn);
      return wrap;
    }
    var daily = weatherState.data.daily;
    wrap.appendChild(el('span', { text: 'Weather', style: 'font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);font-weight:600;flex-shrink:0;' }));
    daily.time.forEach(function(dateStr, i) {
      var info = weatherCodeInfo(daily.weathercode[i]);
      var d = new Date(dateStr + 'T00:00:00');
      var label = i === 0 ? 'Today' : d.toLocaleDateString('en-ZA', { weekday: 'short' });
      var item = el('div', { style: 'display:flex;align-items:center;gap:5px;flex-shrink:0;' });
      item.appendChild(el('span', { text: info[0], style: 'font-size:14px;' }));
      item.appendChild(el('span', { text: label, style: 'font-size:12px;color:var(--ink-soft);' }));
      item.appendChild(el('span', { text: Math.round(daily.temperature_2m_max[i]) + '°/' + Math.round(daily.temperature_2m_min[i]) + '°', style: 'font-size:12.5px;font-weight:600;' }));
      wrap.appendChild(item);
      if (i < daily.time.length - 1) wrap.appendChild(el('span', { text: '·', style: 'color:var(--border);flex-shrink:0;' }));
    });
    if (weatherState.locationLabel) wrap.appendChild(el('span', { text: weatherState.locationLabel, style: 'font-size:11px;color:var(--ink-soft);flex-shrink:0;white-space:nowrap;padding-left:8px;' }));
    return wrap;
  }

  function loadState() {
    if (!hasStorage()) return Promise.resolve(false);
    return window.storage.get(STORAGE_KEY, false).then(function(res) {
      if (res && res.value) {
        try {
          var data = JSON.parse(res.value);
          Object.assign(state, data);
          return true;
        } catch (e) { return false; }
      }
      return false;
    }).catch(function() { return false; });
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'style') e.setAttribute('style', attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c) { if (c) e.appendChild(c); });
    return e;
  }

  function earTag(text, tone) { return el('span', { class: 'ear-tag tag-' + (tone || 'neutral'), text: text }); }

  function navigate(view) { state.view = view; state.menuOpen = false; render(); }

  function render() {
    var root = document.getElementById('root');
    root.innerHTML = '';
    root.appendChild(renderApp());
    scheduleSave();
  }

  function simpleTabBar(tabs, active, onSelect) {
    var bar = el('div', { style: 'display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:18px;' });
    tabs.forEach(function(t) {
      var isAct = t === active;
      var b = el('button', { text: t, style: 'padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap;background:none;border:none;border-bottom:2px solid ' + (isAct ? 'var(--accent)' : 'transparent') + ';color:' + (isAct ? 'var(--ink)' : 'var(--ink-soft)') + ';margin-bottom:-1px;' });
      b.addEventListener('click', function() { onSelect(t); });
      bar.appendChild(b);
    });
    return bar;
  }

  // ---------- App shell with top nav ----------
  function functionalNavItems() {
    return [
      { page: 'dashboard', label: 'Overview', icon: '⌂' },
      { page: 'issues', label: 'Issues', icon: '⚑' },
      { page: 'compliance', label: 'Compliance', icon: '◈' },
      { page: 'inspections', label: 'Inspections', icon: '▤' },

  // ---------- Generic form modal ----------
  function openFormModal(cfg) {
    var overlay = el('div', { style: 'position:fixed;inset:0;background:rgba(35,43,34,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;' });
    var modal = el('div', { class: 'card', style: 'width:100%;max-width:460px;padding:24px;max-height:88vh;overflow-y:auto;' });

    var head = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;' });
    head.appendChild(el('h3', { class: 'font-display', text: cfg.title, style: 'font-size:19px;font-weight:600;' }));
    var closeBtn = el('button', { text: '×', style: 'background:none;border:none;font-size:22px;line-height:1;color:var(--ink-soft);' });
    closeBtn.addEventListener('click', function() { overlay.remove(); });
    head.appendChild(closeBtn);
    modal.appendChild(head);

    var form = el('form', { style: 'display:flex;flex-direction:column;gap:14px;' });
    var initial = cfg.initial || {};
    var inputs = {};

    cfg.fields.forEach(function(f) {
      var field = el('div', {});
      field.appendChild(el('label', { text: f.label, style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }));
      var input;
      if (f.type === 'select') {
        input = el('select', {});
        f.options.forEach(function(o) { input.appendChild(el('option', { value: o.value, text: o.label })); });
        if (initial[f.key] != null) input.value = initial[f.key];
      } else if (f.type === 'textarea') {
        input = el('textarea', { placeholder: f.placeholder || '' });
        input.value = initial[f.key] != null ? initial[f.key] : '';
      } else {
        input = el('input', { type: f.type || 'text', placeholder: f.placeholder || '' });
        input.value = initial[f.key] != null ? initial[f.key] : '';
      }
      inputs[f.key] = input;
      field.appendChild(input);
      form.appendChild(field);
    });

    var btnRow = el('div', { style: 'display:flex;gap:10px;padding-top:6px;flex-wrap:wrap;' });
    if (cfg.onDelete) {
      var delBtn = el('button', { type: 'button', class: 'btn-outline', text: 'Delete', style: 'border-color:rgba(166,67,47,0.4);color:var(--alert);' });
      delBtn.addEventListener('click', function() {
        if (confirmDelete(cfg.deleteLabel || 'this record')) { overlay.remove(); cfg.onDelete(); }
      });
      btnRow.appendChild(delBtn);
    }
    var spacer = el('div', { style: 'flex:1;' });
    btnRow.appendChild(spacer);
    var cancelBtn = el('button', { type: 'button', class: 'btn-outline', text: 'Cancel' });
    cancelBtn.addEventListener('click', function() { overlay.remove(); });
    var saveBtn = el('button', { type: 'submit', class: 'btn-primary', text: 'Save' });
    btnRow.appendChild(cancelBtn); btnRow.appendChild(saveBtn);
    form.appendChild(btnRow);

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var values = {};
      cfg.fields.forEach(function(f) {
        var v = inputs[f.key].value;
        values[f.key] = f.type === 'number' ? Number(v) || 0 : v;
      });
      if (cfg.validate) { var err = cfg.validate(values); if (err) { alert(err); return; } }
      overlay.remove();
      cfg.onSubmit(values);
    });

    modal.appendChild(form);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    inputs[cfg.fields[0].key].focus();
  }

  // ---------- Compliance status helper ----------
  function effectiveComplianceStatus(c) {
    var today = todayStr();
    if (!c.dueDate) return c.status;
    var diff = daysBetween(today, c.dueDate);
    if (diff < 0) return 'overdue';
    if (c.status === 'compliant') return 'compliant';
    if (diff <= 14) return 'due';
    return c.status;
  }

    var overlay = el('div', { style: 'position:fixed;inset:0;background:rgba(35,43,34,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;' });

    form.appendChild(el('div', {}, [el('label', { text: 'Species / crop', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), speciesSelect]));

    var animalSelect = el('select', {});
    function refreshAnimals() {
      animalSelect.innerHTML = '';
      state.animals.filter(function(a) { return a.speciesId === speciesSelect.value; }).forEach(function(a) {
        animalSelect.appendChild(el('option', { value: a.id, text: a.name + ' (' + a.id + ')' }));
      });
    }

    var typeSelect = el('select', {});
    function refreshTypeOptions() {
      var sp = speciesById(speciesSelect.value);
      typeSelect.innerHTML = '';
      var opts = (sp && sp.tracking === 'crop') ? [['care', 'Care / treatment'], ['harvest', 'Harvest']] : [['health', 'Health'], ['breeding', 'Breeding'], ['production', 'Production']];
      opts.forEach(function(o) { typeSelect.appendChild(el('option', { value: o[0], text: o[1] })); });
    }
    speciesSelect.addEventListener('change', function() { refreshAnimals(); refreshTypeOptions(); });
    refreshAnimals();
    form.appendChild(el('div', {}, [el('label', { text: 'Animal / flock / plot', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), animalSelect]));

    refreshTypeOptions();
    form.appendChild(el('div', {}, [el('label', { text: 'Type', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), typeSelect]));

    var dateInput = el('input', { type: 'date' }); dateInput.value = todayStr();
    form.appendChild(el('div', {}, [el('label', { text: 'Date', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), dateInput]));

    var noteInput = el('input', { placeholder: 'e.g. Vaccinated for lumpy skin disease' });
    form.appendChild(el('div', {}, [el('label', { text: 'Note', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), noteInput]));

    var btnRow = el('div', { style: 'display:flex;gap:10px;padding-top:6px;' });
    btnRow.appendChild(el('div', { style: 'flex:1;' }));
    var cancelBtn = el('button', { type: 'button', class: 'btn-outline', text: 'Cancel' });
    cancelBtn.addEventListener('click', function() { overlay.remove(); });
    var saveBtn = el('button', { type: 'submit', class: 'btn-primary', text: 'Log entry' });
    btnRow.appendChild(cancelBtn); btnRow.appendChild(saveBtn);
    form.appendChild(btnRow);

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!animalSelect.value) { alert('Pick an animal or flock first.'); return; }
      if (!noteInput.value.trim()) { alert('Add a short note about what happened.'); return; }
      var animal = state.animals.filter(function(a) { return a.id === animalSelect.value; })[0];
      if (!animal) { overlay.remove(); return; }
      animal.events.unshift({ id: nextId('evt'), date: dateInput.value || todayStr(), type: typeSelect.value, note: noteInput.value.trim() });
      overlay.remove();
      render();
    });

    modal.appendChild(form);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  // ---------- Insight chips (morning glance) ----------
  function renderInsightChips() {
    var chips = [];

    var openIssuesList = state.issues.filter(function(i) { return i.status === 'open'; });
    chips.push({
      icon: '⚑', tone: openIssuesList.length ? 'alert' : 'good',
      title: openIssuesList.length + ' open issue' + (openIssuesList.length === 1 ? '' : 's'),
      sub: openIssuesList.length ? 'Needs a look' : 'All clear',
      weight: openIssuesList.length ? 0 : 3,
      onClick: function() { state.uiTabs.issues = 'Open'; navigate({ page: 'issues' }); }
    });

    var outstandingComp = state.compliance.filter(function(c) { var s = effectiveComplianceStatus(c); return s === 'overdue' || s === 'due'; });
    var overdueComp = state.compliance.filter(function(c) { return effectiveComplianceStatus(c) === 'overdue'; });
    chips.push({
      icon: '◈', tone: overdueComp.length ? 'alert' : (outstandingComp.length ? 'warn' : 'good'),
      title: outstandingComp.length + ' compliance item' + (outstandingComp.length === 1 ? '' : 's'),
      sub: overdueComp.length ? overdueComp.length + ' overdue' : (outstandingComp.length ? 'Due soon' : 'Up to date'),
      weight: overdueComp.length ? 0 : (outstandingComp.length ? 1 : 3),
      onClick: function() { state.uiTabs.compliance = 'Outstanding'; navigate({ page: 'compliance' }); }
    });

    var flaggedAnimals = state.animals.filter(function(a) { return a.status === 'attention' || a.status === 'failed'; });
    chips.push({
      icon: '🩺', tone: flaggedAnimals.length ? 'alert' : 'good',
      title: flaggedAnimals.length + ' record' + (flaggedAnimals.length === 1 ? '' : 's') + ' flagged',
      sub: flaggedAnimals.length ? 'Needs a look' : 'All good',
      weight: flaggedAnimals.length ? 0 : 3,
      onClick: function() {
        if (flaggedAnimals.length === 0) return;
        openListModal('Records needing attention', flaggedAnimals.map(function(a) {
          var sp = speciesById(a.speciesId);
          return { primary: a.name, secondary: sp.label + ' · ' + a.id, tag: { text: a.status, tone: statusTone(a.status) },
            onClick: function() { navigate({ page: 'species', speciesId: a.speciesId, animalId: a.id }); } };
        }));
      }
    });

    var lowStockItems = state.stockItems.filter(function(i) { return i.quantity <= (i.reorderLevel != null ? i.reorderLevel : 2); });
    chips.push({
      icon: '▣', tone: lowStockItems.length ? 'warn' : 'good',
      title: lowStockItems.length + ' low stock item' + (lowStockItems.length === 1 ? '' : 's'),
      sub: lowStockItems.length ? lowStockItems.map(function(i){return i.name;}).slice(0,2).join(', ') : 'Well stocked',
      weight: lowStockItems.length ? 1 : 3,
      onClick: function() { state.uiTabs.stock = 'Inventory'; navigate({ page: 'stock' }); }
    });

    var lastInspection = state.inspections.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); })[0];
    var daysSince = lastInspection ? daysBetween(lastInspection.date, todayStr()) : null;
    var inspTone = daysSince == null ? 'alert' : (daysSince > 45 ? 'alert' : (daysSince > 21 ? 'warn' : 'good'));
    chips.push({
      icon: '▤', tone: inspTone,
      title: daysSince == null ? 'No inspection yet' : daysSince + 'd since last walk-through',
      sub: daysSince == null ? 'Start your first one' : (daysSince > 45 ? 'Overdue for a check' : 'Logged and current'),
      weight: inspTone === 'alert' ? 0 : (inspTone === 'warn' ? 1 : 3),
      onClick: function() { navigate({ page: 'inspections' }); }
    });

    var lastSecurity = state.securityChecks.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); })[0];
    var daysSinceSecurity = lastSecurity ? daysBetween(lastSecurity.date, todayStr()) : null;
    var secTone = daysSinceSecurity == null ? 'alert' : (daysSinceSecurity > 30 ? 'alert' : (daysSinceSecurity > 14 ? 'warn' : 'good'));
    chips.push({
      icon: '🔒', tone: secTone,
      title: daysSinceSecurity == null ? 'No security check yet' : daysSinceSecurity + 'd since last security check',
      sub: daysSinceSecurity == null ? 'Start your first one' : (daysSinceSecurity > 30 ? 'Overdue — fencing, gates, alarms' : 'Fencing and gates checked'),
      weight: secTone === 'alert' ? 0 : (secTone === 'warn' ? 1 : 3),
      onClick: function() { navigate({ page: 'security' }); }
    });

    var now = new Date();
    var monthEntries = financeEntries().filter(function(e) { var d = new Date(e.date); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); });
    var monthNet = monthEntries.reduce(function(s, e) { return s + e.amount; }, 0);
    chips.push({
      icon: '⟠', tone: monthNet >= 0 ? 'good' : 'alert',
      title: (monthNet >= 0 ? '+' : '') + fmtR(monthNet) + ' this month',
      sub: monthNet >= 0 ? 'Net positive so far' : 'Net negative so far',
      weight: monthNet < 0 ? 0 : 3,
      onClick: function() { state.uiTabs.finance = 'Overview'; navigate({ page: 'finance' }); }
    });

    chips.sort(function(a, b) { return a.weight - b.weight; });

    var toneStyles = {
      alert: { bg: 'var(--alert-soft)', color: 'var(--alert)', border: 'rgba(166,67,47,0.35)' },
      warn: { bg: 'var(--warn-soft)', color: 'var(--warn)', border: 'rgba(184,121,15,0.35)' },
      good: { bg: 'var(--good-soft)', color: 'var(--good)', border: 'rgba(63,122,86,0.35)' }
    };
    var wrap = el('div', { style: 'display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:22px;' });
    chips.forEach(function(c) {
      var ts = toneStyles[c.tone] || toneStyles.good;
      var btn = el('button', { style: 'flex:0 0 auto;min-width:172px;text-align:left;padding:13px 16px;border-radius:12px;background:' + ts.bg + ';border:1px solid ' + ts.border + ';' });
      var top = el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px;' });
      top.appendChild(el('span', { text: c.icon, style: 'font-size:16px;' }));
      top.appendChild(el('span', { class: 'font-display', text: c.title, style: 'font-size:14px;font-weight:600;color:' + ts.color + ';' }));
      btn.appendChild(top);
      btn.appendChild(el('p', { text: c.sub, style: 'font-size:12px;color:' + ts.color + ';opacity:0.85;' }));
      btn.addEventListener('click', c.onClick);
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function renderDashboard() {

    var heroRow = el('div', { style: 'display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px;' });

    hero.appendChild(el('p', { text: ownerFirst ? ('Good to see you back, ' + ownerFirst) : 'Here\u2019s what\u2019s happening on the farm today.', style: 'color:var(--ink-soft);font-size:14px;margin-top:8px;' }));

  // ---------- Shared record form fields (livestock + crops) ----------
  function animalFormFieldsFor(sp) {
    var fields = [{
      key: 'name',
      label: sp.tracking === 'crop' ? 'Plot / field name' : (sp.tracking === 'flock' ? 'Flock / pen name' : 'Name or tag'),
      placeholder: sp.tracking === 'crop' ? 'e.g. Tomato bed 2' : (sp.tracking === 'flock' ? 'e.g. Layer flock B' : 'e.g. Thandi')
    }];
    fields.push({ key: 'breed', label: sp.tracking === 'crop' ? 'Variety' : 'Breed' });
    if (sp.tracking === 'crop') {
      fields.push({ key: 'count', label: 'Area planted (' + sp.unit + ')', type: 'number' });
      fields.push({ key: 'status', label: 'Status', type: 'select', options: [
        { value: 'growing', label: 'Growing' }, { value: 'ready', label: 'Ready to harvest' }, { value: 'harvested', label: 'Harvested' }, { value: 'failed', label: 'Failed / lost' }
      ] });
    } else if (sp.tracking === 'flock') {
      fields.push({ key: 'count', label: 'Number of birds', type: 'number' });
      fields.push({ key: 'status', label: 'Status', type: 'select', options: [
        { value: 'healthy', label: 'Healthy' }, { value: 'attention', label: 'Needs attention' }, { value: 'sold', label: 'Sold' }, { value: 'deceased', label: 'Deceased' }
      ] });
    } else {
      fields.push({ key: 'weightKg', label: 'Weight (kg)', type: 'number' });
      fields.push({ key: 'status', label: 'Status', type: 'select', options: [
        { value: 'healthy', label: 'Healthy' }, { value: 'attention', label: 'Needs attention' }, { value: 'sold', label: 'Sold' }, { value: 'deceased', label: 'Deceased' }
      ] });
    }
    return fields;
  }
  function defaultStatusFor(sp) { return sp.tracking === 'crop' ? 'growing' : 'healthy'; }

  // ---------- Species page ----------
  function renderSpeciesPage() {
    var speciesId = state.view.speciesId;
    var sp = speciesById(speciesId);
    var list = state.animals.filter(function(a) { return a.speciesId === speciesId; });

    if (state.view.animalId) {
      var animal = list.filter(function(a) { return a.id === state.view.animalId; })[0];
      if (animal) return renderAnimalDetail(animal, sp);
    }

    var wrap = el('div', {});
    var header = el('div', { style: 'display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;' });
    header.appendChild(pageHeader(sp.tracking === 'crop' ? 'Plot records' : (sp.tracking === 'flock' ? 'Flock records' : 'Individual records'), sp.icon + '  ' + sp.label));
    var addLabel = sp.tracking === 'crop' ? 'plot' : (sp.tracking === 'flock' ? 'flock/batch' : sp.label.replace(/s$/, ''));
    var addBtn = el('button', { class: 'btn-primary', text: '+ Add ' + addLabel });
    header.appendChild(addBtn);
    wrap.appendChild(header);

    var grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;' });

    function animalFormFields() { return animalFormFieldsFor(sp); }

    function openAdd() {
      openFormModal({
        title: 'Add ' + addLabel,
        fields: animalFormFields(),
        initial: { status: defaultStatusFor(sp) },
        validate: function(v) { if (!v.name || !v.name.trim()) return 'Give this record a name or tag.'; },
        onSubmit: function(v) {
          var rec = Object.assign({ id: nextId(speciesId.slice(0,3)), speciesId: speciesId, tracking: sp.tracking, createdAt: todayStr(), events: [], finance: [] }, v);
          state.animals.push(rec);
          render();
        }
      });
    }
    addBtn.addEventListener('click', openAdd);

    function openEdit(a) {
      openFormModal({
        title: 'Edit ' + a.name,
        fields: animalFormFields(),
        initial: a,
        deleteLabel: a.name,
        validate: function(v) { if (!v.name || !v.name.trim()) return 'Give this record a name or tag.'; },
        onDelete: function() { state.animals = state.animals.filter(function(x){ return x.id !== a.id; }); render(); },
        onSubmit: function(v) { Object.assign(a, v); render(); }
      });
    }

    var filterTabs = sp.tracking === 'crop' ? ['All', 'Growing', 'Ready', 'Harvested', 'Failed'] : ['All', 'Healthy', 'Attention', 'Sold', 'Deceased'];
    var filterMap = sp.tracking === 'crop'
      ? { All: null, Growing: 'growing', Ready: 'ready', Harvested: 'harvested', Failed: 'failed' }
      : { All: null, Healthy: 'healthy', Attention: 'attention', Sold: 'sold', Deceased: 'deceased' };
    var currentFilter = state.view.statusFilter || 'All';
    if (list.length > 0) wrap.appendChild(simpleTabBar(filterTabs, currentFilter, function(t) { state.view.statusFilter = t; render(); }));
    var visibleList = filterMap[currentFilter] ? list.filter(function(a) { return a.status === filterMap[currentFilter]; }) : list;

    if (list.length === 0) {
      var empty = el('div', { class: 'card', style: 'border-style:dashed;text-align:center;padding:40px 20px;grid-column:1/-1;' });
      empty.appendChild(el('p', { text: 'No ' + sp.label.toLowerCase() + ' recorded yet', style: 'font-weight:500;margin-bottom:4px;' }));
      empty.appendChild(el('p', { text: 'Add your first record to start tracking it.', style: 'color:var(--ink-soft);font-size:14px;' }));
      grid.appendChild(empty);
    } else if (visibleList.length === 0) {
      var emptyFiltered = el('div', { class: 'card', style: 'border-style:dashed;text-align:center;padding:32px 20px;grid-column:1/-1;' });
      emptyFiltered.appendChild(el('p', { text: 'Nothing in ' + currentFilter.toLowerCase() + ' right now.', style: 'color:var(--ink-soft);font-size:14px;' }));
      grid.appendChild(emptyFiltered);
    }
    visibleList.forEach(function(a) {
      var card = el('div', { class: 'card', style: 'padding:16px;' });
      var top = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;' });
      top.appendChild(earTag(a.id, 'neutral'));
      top.appendChild(el('span', { text: statusLabel(a.status), style: 'font-size:12px;color:var(--ink-soft);' }));
      card.appendChild(top);

      var body = el('button', { style: 'width:100%;text-align:left;background:none;border:none;padding:0;' });
      body.appendChild(el('p', { class: 'font-display', text: a.name, style: 'font-weight:600;' }));
      body.appendChild(el('p', { text: a.breed || '', style: 'color:var(--ink-soft);font-size:13px;' }));
      var metaText = (sp.tracking === 'flock' || sp.tracking === 'crop') ? (a.count + ' ' + sp.unit) : (a.weightKg + ' kg');
      body.appendChild(el('p', { text: metaText, style: 'font-size:12px;color:var(--ink-soft);margin-top:8px;' }));
      body.addEventListener('click', function() { navigate({ page: 'species', speciesId: speciesId, animalId: a.id }); });
      card.appendChild(body);

      var actions = el('div', { style: 'display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);' });
      var editLink = el('button', { class: 'btn-link-text', text: 'Edit' });
      editLink.addEventListener('click', function(e) { e.stopPropagation(); openEdit(a); });
      var delLink = el('button', { class: 'btn-danger-text', text: 'Delete' });
      delLink.addEventListener('click', function(e) {
        e.stopPropagation();
        if (confirmDelete(a.name)) { state.animals = state.animals.filter(function(x){ return x.id !== a.id; }); render(); }
      });
      actions.appendChild(editLink); actions.appendChild(delLink);
      card.appendChild(actions);

      grid.appendChild(card);
    });

    wrap.appendChild(grid);
    return wrap;
  }

  function statusLabel(status) {
    return {
      healthy: 'Healthy', attention: 'Needs attention', sold: 'Sold', deceased: 'Deceased',
      growing: 'Growing', ready: 'Ready to harvest', harvested: 'Harvested', failed: 'Failed / lost'
    }[status] || status;
  }
  function statusTone(status) {
    return {
      healthy: 'healthy', attention: 'attention', sold: 'sold', deceased: 'deceased',
      growing: 'neutral', ready: 'due', harvested: 'compliant', failed: 'attention'

    function renderContent() {
      contentArea.innerHTML = '';

        var grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;' });

        contentArea.appendChild(eventLogSection(['production'], 'No production records yet.', null));
      } else if (activeTab === 'Care & Treatments') {
        contentArea.appendChild(eventLogSection(['care'], 'No care or treatment entries logged yet.', null));
      } else if (activeTab === 'Harvest') {
        contentArea.appendChild(eventLogSection(['harvest'], 'No harvest entries logged yet.', null));
      } else if (activeTab === 'Finance') {

        var addForm = el('form', { class: 'card', style: 'padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;' });

          animal.finance.unshift({ id: nextId('fin'), date: fDate.value || todayStr(), type: typeSel.value, label: labelInput.value.trim(), amount: amt });
          labelInput.value = ''; amountInput.value = '';

        } else {
          animal.finance.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); }).forEach(function(f, i) {
            var row = el('div', { class: 'row-link', style: 'padding:12px 16px;' + (i > 0 ? 'border-top:1px solid var(--border);' : '') });
            row.appendChild(el('div', {}, [el('p', { text: f.label, style: 'font-size:14px;' }), el('p', { text: f.date, style: 'font-size:12px;color:var(--ink-soft);' })]));
            var right = el('div', { style: 'display:flex;align-items:center;gap:12px;' });
            right.appendChild(el('span', { text: (f.amount >= 0 ? '+' : '') + fmtR(f.amount), style: 'font-family:"IBM Plex Mono",monospace;font-weight:600;color:' + (f.amount >= 0 ? 'var(--primary)' : 'var(--alert)') }));
            var del = el('button', { class: 'btn-danger-text', text: 'Delete' });

              if (confirmDelete('this transaction')) { animal.finance = animal.finance.filter(function(x){ return x.id !== f.id; }); render(); }
            });
            right.appendChild(del);
            row.appendChild(right);
            finCard.appendChild(row);
          });
        }
        finWrap.appendChild(finCard);
        contentArea.appendChild(finWrap);
      }
    }

    renderTabs();
    renderContent();
    wrap.appendChild(tabBar);
    wrap.appendChild(contentArea);
    return wrap;
  }

    function itemFields() {
      return [
        { key: 'name', label: 'Item name', placeholder: 'e.g. Cattle feed pellets' },
        { key: 'unit', label: 'Unit', placeholder: 'e.g. bags, litres, kg' },
        { key: 'quantity', label: 'Current quantity', type: 'number' },

        { key: 'reorderLevel', label: 'Reorder alert level', type: 'number', placeholder: 'Flag as low stock at or below this' }
      ];
    }

    addBtn.addEventListener('click', function() {
      openFormModal({ title: 'Add stock item', fields: itemFields(), initial: { quantity: 0, costPerUnit: 0 },
        validate: function(v) { if (!v.name || !v.name.trim()) return 'Give this item a name.'; },

      var itemsCard = el('div', { class: 'card' });

        itemsCard.appendChild(el('p', { text: 'No stock items added yet.', style: 'padding:18px;color:var(--ink-soft);font-size:14px;' }));
      } else {
        state.stockItems.forEach(function(item, idx) {
          var low = item.quantity <= (item.reorderLevel != null ? item.reorderLevel : 2);
          var row = el('div', { style: 'padding:14px 16px;' + (idx > 0 ? 'border-top:1px solid var(--border);' : '') });
          var top = el('div', { class: 'row-link' });

          var rightTop = el('div', { style: 'display:flex;align-items:center;gap:8px;' });
          if (low) rightTop.appendChild(earTag('low stock', 'attention'));
          rightTop.appendChild(el('span', { text: item.quantity + ' ' + item.unit + ' on hand', style: 'font-size:13px;color:var(--ink-soft);' }));
          top.appendChild(rightTop);
          row.appendChild(top);

          var actions = el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;' });
          var inBtn = el('button', { class: 'btn-outline', text: '+ Stock in', style: 'padding:7px 12px;font-size:13px;' });
          var outBtn = el('button', { class: 'btn-outline', text: '– Stock out', style: 'padding:7px 12px;font-size:13px;' });
          var editBtn = el('button', { class: 'btn-link-text', text: 'Edit' });
          var delBtn = el('button', { class: 'btn-danger-text', text: 'Delete' });

          function openMoveModal(type) {
            openFormModal({
              title: (type === 'in' ? 'Stock in — ' : 'Stock out — ') + item.name,
              fields: [
                { key: 'date', label: 'Date', type: 'date' },
                { key: 'quantity', label: 'Quantity (' + item.unit + ')', type: 'number' },
                { key: 'cost', label: type === 'in' ? 'Total cost (R)' : 'Value (R, optional)', type: 'number' },
                { key: 'note', label: 'Note', placeholder: type === 'in' ? 'e.g. Monthly feed order' : 'e.g. Fed to herd' }
              ],
              initial: { cost: 0, date: todayStr() },
              validate: function(v) {
                if (!v.quantity || v.quantity <= 0) return 'Enter a quantity greater than zero.';
                if (type === 'out' && v.quantity > item.quantity) return 'Only ' + item.quantity + ' ' + item.unit + ' available.';
              },
              onSubmit: function(v) {
                item.quantity = type === 'in' ? item.quantity + v.quantity : Math.max(0, item.quantity - v.quantity);
                state.stockMoves.unshift({ id: nextId('mov'), itemId: item.id, date: v.date || todayStr(), type: type, quantity: v.quantity, cost: v.cost, note: v.note });
                if (type === 'in' && v.cost) state.farmFinance.unshift({ id: nextId('gfin'), date: v.date || todayStr(), type: 'expense', label: 'Stock purchase — ' + item.name, amount: -Math.abs(v.cost) });
                render();
              }
            });
          }
          inBtn.addEventListener('click', function() { openMoveModal('in'); });
          outBtn.addEventListener('click', function() { openMoveModal('out'); });
          editBtn.addEventListener('click', function() {
            openFormModal({ title: 'Edit ' + item.name, fields: itemFields(), initial: item, deleteLabel: item.name,
              validate: function(v) { if (!v.name || !v.name.trim()) return 'Give this item a name.'; },

              onSubmit: function(v) { Object.assign(item, v); render(); } });
          });
          delBtn.addEventListener('click', function() {
            if (confirmDelete(item.name)) { state.stockItems = state.stockItems.filter(function(x){ return x.id !== item.id; }); render(); }
          });

          actions.appendChild(inBtn); actions.appendChild(outBtn); actions.appendChild(editBtn); actions.appendChild(delBtn);
          row.appendChild(actions);
          itemsCard.appendChild(row);
        });
      }
      wrap.appendChild(itemsCard);
    } else {
      var movesCard = el('div', { class: 'card' });

          leftTop.appendChild(earTag(m.type === 'in' ? 'stock in' : 'stock out', m.type === 'in' ? 'healthy' : 'neutral'));
          leftTop.appendChild(el('span', { text: (item ? item.name : 'Unknown item') + ' · ' + m.quantity + (item ? ' ' + item.unit : ''), style: 'font-size:14px;' }));
          left.appendChild(leftTop);
          if (m.note) left.appendChild(el('p', { text: m.note, style: 'font-size:12px;color:var(--ink-soft);margin-top:3px;' }));

          movesCard.appendChild(row);
        });
      }

  // ---------- Insights page (charts) ----------
  function buildActivityMap() {
    var map = {};
    function bump(d) { if (!d) return; map[d] = (map[d] || 0) + 1; }
    state.animals.forEach(function(a) {
      a.events.forEach(function(e) { bump(e.date); });
      a.finance.forEach(function(f) { bump(f.date); });
    });
    state.farmFinance.forEach(function(f) { bump(f.date); });
    state.issues.forEach(function(i) { bump(i.date); });
    state.inspections.forEach(function(i) { bump(i.date); });
    state.securityChecks.forEach(function(i) { bump(i.date); });
    state.stockMoves.forEach(function(m) { bump(m.date); });
    return map;
  }

  // Generic small SVG line/area chart builder — no external library needed.
  function buildLineChartSVG(series, xLabels, opts) {
    opts = opts || {};
    var W = opts.width || 760, H = opts.height || 240;
    var padL = 48, padR = 16, padT = 16, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var allValues = [0];
    series.forEach(function(s) { s.values.forEach(function(v) { allValues.push(v); }); });
    var maxV = Math.max.apply(null, allValues);
    var minV = Math.min.apply(null, allValues.concat([0]));
    if (maxV === minV) maxV = minV + 1;
    var n = xLabels.length;
    function xAt(i) { return padL + (n <= 1 ? innerW / 2 : (innerW * i / (n - 1))); }
    function yAt(v) { var t = (v - minV) / (maxV - minV); return padT + innerH * (1 - t); }
    var parts = [];
    parts.push('<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:Work Sans, sans-serif;">');
    var gridCount = 4;
    for (var g = 0; g <= gridCount; g++) {
      var gv = minV + (maxV - minV) * g / gridCount;
      var gy = yAt(gv);
      parts.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="rgba(91,99,85,0.15)" stroke-width="1" />');
      parts.push('<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" font-size="10" fill="#5B6355" text-anchor="end">' + (opts.yFormat ? opts.yFormat(gv) : Math.round(gv)) + '</text>');
    }
    var labelStep = Math.max(1, Math.ceil(n / 7));
    xLabels.forEach(function(lab, i) {
      if (i % labelStep !== 0 && i !== n - 1) return;
      parts.push('<text x="' + xAt(i) + '" y="' + (H - 8) + '" font-size="10" fill="#5B6355" text-anchor="middle">' + lab + '</text>');
    });
    series.forEach(function(s) {
      var pts = s.values.map(function(v, i) { return xAt(i) + ',' + yAt(v); }).join(' ');
      if (s.fill) {
        var areaPts = pts + ' ' + xAt(n - 1) + ',' + yAt(minV) + ' ' + xAt(0) + ',' + yAt(minV);
        parts.push('<polygon points="' + areaPts + '" fill="' + s.color + '" opacity="0.16" />');
      }
      parts.push('<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />');
      s.values.forEach(function(v, i) {
        parts.push('<circle cx="' + xAt(i) + '" cy="' + yAt(v) + '" r="3.2" fill="' + s.color + '"><title>' + xLabels[i] + ': ' + (opts.yFormat ? opts.yFormat(v) : v) + '</title></circle>');
      });
    });
    parts.push('</svg>');
    return parts.join('');
  }

  function renderActivityChart() {
    var map = buildActivityMap();
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var start = new Date(today); start.setDate(today.getDate() - (12 * 7 - 1));
    start.setDate(start.getDate() - start.getDay());
    var labels = [], values = [];
    for (var w = 0; w < 12; w++) {
      var wkStart = new Date(start); wkStart.setDate(start.getDate() + w * 7);
      var sum = 0;
      for (var d = 0; d < 7; d++) {
        var day = new Date(wkStart); day.setDate(wkStart.getDate() + d);
        if (day > today) continue;
        sum += map[day.toISOString().slice(0, 10)] || 0;
      }
      values.push(sum);
      labels.push(wkStart.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short' }));
    }
    var svg = buildLineChartSVG([{ name: 'Activity', color: '#2F4A38', fill: true, values: values }], labels, { yFormat: function(v) { return Math.round(v); } });
    var wrap = el('div', { class: 'card', style: 'padding:18px;' });
    wrap.appendChild(el('div', { html: svg }));
    var total = values.reduce(function(s, v) { return s + v; }, 0);
    wrap.appendChild(el('p', { text: total + ' logged actions over the last 12 weeks — health and breeding events, transactions, stock moves, inspections, security checks and issues, added together per week.', style: 'font-size:12px;color:var(--ink-soft);margin-top:8px;' }));
    return wrap;
  }

  function renderHealthBarChart() {
    var statuses = [
      { key: 'healthy', color: '#3F7A56', label: 'Healthy' },
      { key: 'attention', color: '#A6432F', label: 'Attention' },
      { key: 'sold', color: '#C98A2C', label: 'Sold' },
      { key: 'deceased', color: '#5B6355', label: 'Deceased' }
    ];
    var wrap = el('div', { class: 'card', style: 'padding:18px;' });
    var legend = el('div', { style: 'display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;' });
    statuses.forEach(function(s) {
      var item = el('div', { style: 'display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);' });
      item.appendChild(el('span', { style: 'width:10px;height:10px;border-radius:3px;background:' + s.color + ';display:inline-block;' }));
      item.appendChild(el('span', { text: s.label }));
      legend.appendChild(item);
    });
    wrap.appendChild(legend);
    var livestockIds = state.farm.speciesIds.filter(function(id) { return speciesById(id).tracking !== 'crop'; });
    if (livestockIds.length === 0) {
      wrap.appendChild(el('p', { text: 'No livestock being tracked yet.', style: 'color:var(--ink-soft);font-size:13px;' }));
      return wrap;
    }
    livestockIds.forEach(function(id) {
      var sp = speciesById(id);
      var counts = { healthy: 0, attention: 0, sold: 0, deceased: 0 };
      state.animals.forEach(function(a) { if (a.speciesId === id) counts[a.status] = (counts[a.status] || 0) + 1; });
      var total = counts.healthy + counts.attention + counts.sold + counts.deceased;
      var row = el('div', { style: 'margin-bottom:16px;' });
      var top = el('div', { style: 'display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;' });
      top.appendChild(el('span', { text: sp.icon + ' ' + sp.label }));
      top.appendChild(el('span', { text: total + ' total', style: 'color:var(--ink-soft);font-weight:500;' }));
      row.appendChild(top);
      var barOuter = el('div', { style: 'display:flex;width:100%;height:24px;border-radius:6px;overflow:hidden;background:var(--parchment-alt);' });
      if (total === 0) {
        barOuter.appendChild(el('div', { style: 'width:100%;' }));
      } else {
        statuses.forEach(function(s) {
          var v = counts[s.key];
          if (v <= 0) return;
          var pct = (v / total * 100);
          var seg = el('div', { title: s.label + ': ' + v, style: 'width:' + pct + '%;background:' + s.color + ';display:flex;align-items:center;justify-content:center;' });
          if (pct > 8) seg.appendChild(el('span', { text: String(v), style: 'font-size:11px;color:#fff;font-weight:600;' }));
          barOuter.appendChild(seg);
        });
      }
      row.appendChild(barOuter);
      wrap.appendChild(row);
    });
    if (state.farm.speciesIds.some(function(id) { return speciesById(id).tracking === 'crop'; })) {
      wrap.appendChild(el('p', { text: 'Crop plots use growing / ready / harvested / failed instead — see the Headcount summary report for those.', style: 'font-size:11px;color:var(--ink-soft);margin-top:6px;' }));
    }
    return wrap;
  }

  function renderCashflowChart() {
    var months = [];
    var base = new Date(); base.setDate(1);
    for (var i = 5; i >= 0; i--) months.push(new Date(base.getFullYear(), base.getMonth() - i, 1));
    function key(m) { return m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0'); }
    var incomeByMonth = {}, expenseByMonth = {};
    months.forEach(function(m) { incomeByMonth[key(m)] = 0; expenseByMonth[key(m)] = 0; });
    financeEntries().forEach(function(f) {
      var k = key(new Date(f.date));
      if (incomeByMonth[k] == null) return;
      if (f.amount >= 0) incomeByMonth[k] += f.amount; else expenseByMonth[k] += Math.abs(f.amount);
    });
    var labels = months.map(function(m) { return m.toLocaleString('en-ZA', { month: 'short' }); });
    var incomeVals = months.map(function(m) { return incomeByMonth[key(m)]; });
    var expenseVals = months.map(function(m) { return expenseByMonth[key(m)]; });
    var svg = buildLineChartSVG([
      { name: 'Income', color: '#3F7A56', values: incomeVals },
      { name: 'Expenses', color: '#A6432F', values: expenseVals }
    ], labels, { yFormat: function(v) { return fmtR(v); } });
    var wrap = el('div', { class: 'card', style: 'padding:18px;' });
    var legend = el('div', { style: 'display:flex;gap:16px;margin-bottom:8px;' });
    [['Income', '#3F7A56'], ['Expenses', '#A6432F']].forEach(function(l) {
      var item = el('div', { style: 'display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);' });
      item.appendChild(el('span', { style: 'width:14px;height:3px;border-radius:2px;background:' + l[1] + ';display:inline-block;' }));
      item.appendChild(el('span', { text: l[0] }));
      legend.appendChild(item);
    });
    wrap.appendChild(legend);
    wrap.appendChild(el('div', { html: svg }));
    return wrap;
  }

  function renderInsightsPage() {

  // ---------- Reports ----------
  function simpleTable(headers, rows) {
    var scrollWrap = el('div', { style: 'overflow-x:auto;-webkit-overflow-scrolling:touch;' });
    var table = el('table', { style: 'width:100%;min-width:480px;border-collapse:collapse;font-size:13px;' });
    var thead = el('tr', {});
    headers.forEach(function(h) { thead.appendChild(el('th', { text: h, style: 'text-align:left;padding:8px 6px;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;' })); });
    table.appendChild(thead);
    rows.forEach(function(r) {
      var tr = el('tr', {});
      r.forEach(function(c) { tr.appendChild(el('td', { text: String(c), style: 'padding:7px 6px;border-bottom:1px solid var(--border);' })); });
      table.appendChild(tr);
    });
    scrollWrap.appendChild(table);
    return scrollWrap;
  }
  function emptyNote(text) { return el('p', { text: text, style: 'color:var(--ink-soft);font-size:13px;' }); }

  function buildHeadcountReport() {
    var wrap = el('div', {});
    var livestockIds = state.farm.speciesIds.filter(function(id) { return speciesById(id).tracking !== 'crop'; });
    var cropIds = state.farm.speciesIds.filter(function(id) { return speciesById(id).tracking === 'crop'; });
    if (livestockIds.length) {
      var rows = livestockIds.map(function(id) {
        var sp = speciesById(id);
        var list = state.animals.filter(function(a) { return a.speciesId === id; });
        var total = list.reduce(function(s, a) { return s + (a.tracking === 'flock' ? (a.count || 0) : 1); }, 0);
        function c(status) { return list.filter(function(a) { return a.status === status; }).length; }
        return [sp.label, total, c('healthy'), c('attention'), c('sold'), c('deceased')];
      });
      wrap.appendChild(el('h4', { class: 'font-display', text: 'Livestock', style: 'font-size:14px;font-weight:600;margin-bottom:6px;' }));
      wrap.appendChild(simpleTable(['Species', 'Total', 'Healthy', 'Attention', 'Sold', 'Deceased'], rows));
    }
    if (cropIds.length) {
      var cropRows = cropIds.map(function(id) {
        var sp = speciesById(id);
        var list = state.animals.filter(function(a) { return a.speciesId === id; });
        function c(status) { return list.filter(function(a) { return a.status === status; }).length; }
        return [sp.label, list.length, c('growing'), c('ready'), c('harvested'), c('failed')];
      });
      wrap.appendChild(el('h4', { class: 'font-display', text: 'Crops', style: 'font-size:14px;font-weight:600;margin:' + (livestockIds.length ? '16px 0 6px' : '0 0 6px') + ';' }));
      wrap.appendChild(simpleTable(['Crop', 'Plots', 'Growing', 'Ready', 'Harvested', 'Failed'], cropRows));
    }
    if (!livestockIds.length && !cropIds.length) wrap.appendChild(emptyNote('No livestock or crops recorded yet.'));
    return wrap;
  }
  function buildHealthBreedingReport() {
    var rows = [];
    state.animals.forEach(function(a) { a.events.filter(function(e) { return e.type === 'health' || e.type === 'breeding'; }).forEach(function(e) { rows.push([e.date, a.name, e.type, e.note]); }); });
    rows.sort(function(a, b) { return new Date(b[0]) - new Date(a[0]); });
    return rows.length ? simpleTable(['Date', 'Animal', 'Type', 'Note'], rows) : emptyNote('No health or breeding events recorded yet.');
  }
  function buildProductionReport() {
    var rows = [];
    state.animals.forEach(function(a) { var sp = speciesById(a.speciesId); if (sp.prodKey && a[sp.prodKey] != null) rows.push([a.name, sp.label, sp.prodLabel, a[sp.prodKey]]); });
    var logRows = [];
    state.animals.forEach(function(a) { a.events.filter(function(e) { return e.type === 'production'; }).forEach(function(e) { logRows.push([e.date, a.name, e.note]); }); });
    logRows.sort(function(a, b) { return new Date(b[0]) - new Date(a[0]); });
    var wrap = el('div', {});

    wrap.appendChild(el('h4', { class: 'font-display', text: 'Production log', style: 'font-size:14px;font-weight:600;margin:16px 0 6px;' }));
    wrap.appendChild(logRows.length ? simpleTable(['Date', 'Animal/flock', 'Note'], logRows) : emptyNote('No production events logged.'));
    return wrap;
  }
  function buildFinanceReport() {
    var entries = financeEntries();
    var income = 0, expense = 0;
    entries.forEach(function(e) { if (e.amount >= 0) income += e.amount; else expense += e.amount; });
    var rows = entries.map(function(e) { return [e.date, e.source, e.type, (e.amount >= 0 ? '+' : '') + fmtR(e.amount), e.label]; });
    var wrap = el('div', {});
    wrap.appendChild(el('p', { text: 'Income: ' + fmtR(income) + '   ·   Expenses: ' + fmtR(Math.abs(expense)) + '   ·   Net: ' + fmtR(income + expense), style: 'font-weight:600;margin-bottom:10px;' }));

    return wrap;
  }
  function buildComplianceReport() {
    var rows = state.compliance.map(function(c) { return [c.name, c.category, c.dueDate, effectiveComplianceStatus(c), c.notes || '']; });
    return rows.length ? simpleTable(['Item', 'Category', 'Due date', 'Status', 'Notes'], rows) : emptyNote('No compliance items tracked.');
  }
  function buildInspectionReport() {
