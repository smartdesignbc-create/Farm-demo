  function buildStockReport() {
    var wrap = el('div', {});
    wrap.appendChild(el('h4', { class: 'font-display', text: 'Current stock', style: 'font-size:14px;font-weight:600;margin-bottom:6px;' }));
    wrap.appendChild(state.stockItems.length ? simpleTable(['Item', 'Quantity', 'Unit', 'Cost/unit'], state.stockItems.map(function(i) { return [i.name, i.quantity, i.unit, fmtR(i.costPerUnit)]; })) : emptyNote('No stock items.'));
    wrap.appendChild(el('h4', { class: 'font-display', text: 'Movement log', style: 'font-size:14px;font-weight:600;margin:16px 0 6px;' }));
    var moveRows = state.stockMoves.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); }).map(function(m) {
      var item = state.stockItems.filter(function(i) { return i.id === m.itemId; })[0];
      return [m.date, item ? item.name : 'Unknown', m.type, m.quantity, m.note || ''];
    });
    wrap.appendChild(moveRows.length ? simpleTable(['Date', 'Item', 'Type', 'Quantity', 'Note'], moveRows) : emptyNote('No movements logged.'));
    return wrap;
  }
  function buildTraceabilityReport() {
    var rows = state.animals.filter(function(a) { return a.tracking !== 'crop'; }).map(function(a) {
      var sp = speciesById(a.speciesId);
      var onFarm = (a.status !== 'sold' && a.status !== 'deceased');
      return [a.id, a.name, sp.label, a.createdAt, onFarm ? 'On farm' : (a.status === 'sold' ? 'Sold off farm' : 'Deceased')];
    });
    return rows.length ? simpleTable(['ID', 'Name', 'Species', 'On farm since', 'Current status'], rows) : emptyNote('No animal records.');
  }
  function buildCropCareReport() {
    var rows = [];
    state.animals.forEach(function(a) {
      var sp = speciesById(a.speciesId);
      if (sp.tracking !== 'crop') return;
      a.events.forEach(function(e) { rows.push([e.date, a.name, e.type, e.note]); });
    });
    rows.sort(function(a, b) { return new Date(b[0]) - new Date(a[0]); });
    return rows.length ? simpleTable(['Date', 'Plot', 'Type', 'Note'], rows) : emptyNote('No crop care or harvest entries recorded yet.');
  }

  function printReport(title, contentEl) {
    var printRoot = document.getElementById('print-root');
    if (!printRoot) { printRoot = el('div', { id: 'print-root' }); document.body.appendChild(printRoot); }
    printRoot.innerHTML = '';
    printRoot.appendChild(el('h1', { class: 'font-display', text: title, style: 'font-size:22px;margin-bottom:4px;' }));
    printRoot.appendChild(el('p', { text: state.farm.farmName + ' · Generated ' + todayStr(), style: 'color:#555;font-size:12px;margin-bottom:16px;' }));
    printRoot.appendChild(contentEl.cloneNode(true));
    document.body.classList.add('printing');
    window.print();
  }
  window.onafterprint = function() { document.body.classList.remove('printing'); };

  function openReportModal(title, buildFn) {
    var overlay = el('div', { style: 'position:fixed;inset:0;background:rgba(35,43,34,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;' });
    var modal = el('div', { class: 'card', style: 'width:100%;max-width:640px;padding:24px;max-height:88vh;overflow-y:auto;' });
    var head = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;' });
    head.appendChild(el('h3', { class: 'font-display', text: title, style: 'font-size:19px;font-weight:600;' }));
    var closeBtn = el('button', { text: '×', style: 'background:none;border:none;font-size:22px;color:var(--ink-soft);' });
    closeBtn.addEventListener('click', function() { overlay.remove(); });
    head.appendChild(closeBtn);
    modal.appendChild(head);
    var content = el('div', {});
    content.appendChild(buildFn());
    modal.appendChild(content);
    var btnRow = el('div', { style: 'display:flex;gap:10px;margin-top:18px;' });
    var printBtn = el('button', { class: 'btn-primary', text: 'Print / Save as PDF' });
    printBtn.addEventListener('click', function() { printReport(title, content); });
    var closeBtn2 = el('button', { class: 'btn-outline', text: 'Close' });
    closeBtn2.addEventListener('click', function() { overlay.remove(); });
    btnRow.appendChild(printBtn); btnRow.appendChild(closeBtn2);
    modal.appendChild(btnRow);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  function renderReportsPage() {
    var REPORTS = [
      { label: 'Headcount summary', desc: 'Total animals and flocks by species, current status breakdown.', build: buildHeadcountReport },
      { label: 'Health & breeding log', desc: 'Every vaccination, treatment and breeding event, in order.', build: buildHealthBreedingReport },
      { label: 'Production summary', desc: 'Milk, wool, eggs and growth records over the selected period.', build: buildProductionReport },
      { label: 'Income & expense statement', desc: 'Full farm profit and loss, exportable for record-keeping.', build: buildFinanceReport },
      { label: 'Compliance status', desc: 'Every compliance item, its status and due date, in one place.', build: buildComplianceReport },
      { label: 'Inspection history', desc: 'Every completed inspection with its checklist and notes.', build: buildInspectionReport },
      { label: 'Security check history', desc: 'Every completed security check — fencing, gates, alarms and cameras.', build: buildSecurityReport },
      { label: 'Stock & movement log', desc: 'Stock levels and every stock-in / stock-out movement recorded.', build: buildStockReport },
      { label: 'Movement & traceability', desc: 'Animal on/off-farm status, for compliance records.', build: buildTraceabilityReport },
      { label: 'Crop care & harvest log', desc: 'Every planting, care, treatment and harvest entry across all plots.', build: buildCropCareReport }
    ];
    var wrap = el('div', {});
    wrap.appendChild(pageHeader('Whole farm', 'Reports', 'Generate a report from your current records, then print it or save it as a PDF to keep or share.'));
    var grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;' });
    REPORTS.forEach(function(r) {
      var c = el('div', { class: 'card', style: 'padding:18px;' });
      c.appendChild(el('p', { class: 'font-display', text: r.label, style: 'font-weight:600;margin-bottom:6px;' }));
      c.appendChild(el('p', { text: r.desc, style: 'color:var(--ink-soft);font-size:13px;margin-bottom:14px;' }));
      var btn = el('button', { class: 'btn-secondary', text: 'Generate report', style: 'font-size:13px;' });
      btn.addEventListener('click', function() { openReportModal(r.label, r.build); });
      c.appendChild(btn);
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  // ---------- Settings ----------
  function renderSettingsPage() {
    var wrap = el('div', {});
    wrap.appendChild(pageHeader('Farm setup', 'Settings', 'Farm details, which species you track, and your data.'));

    var detailsCard = el('div', { class: 'card', style: 'padding:18px;margin-bottom:20px;max-width:480px;' });
    detailsCard.appendChild(el('h3', { class: 'font-display', text: 'Farm details', style: 'font-size:16px;font-weight:600;margin-bottom:12px;' }));
    var form = el('form', { style: 'display:flex;flex-direction:column;gap:12px;' });
    var nameInput = el('input', {}); nameInput.value = state.farm.farmName;
    var ownerInput = el('input', {}); ownerInput.value = state.farm.ownerName;
    form.appendChild(el('div', {}, [el('label', { text: 'Farm name', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), nameInput]));
    form.appendChild(el('div', {}, [el('label', { text: 'Owner / manager', style: 'display:block;font-size:13px;font-weight:500;margin-bottom:5px;' }), ownerInput]));
    var saveBtn = el('button', { type: 'submit', class: 'btn-primary', text: 'Save details', style: 'align-self:flex-start;' });
    form.appendChild(saveBtn);
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      state.farm.farmName = nameInput.value.trim() || state.farm.farmName;
      state.farm.ownerName = ownerInput.value.trim() || state.farm.ownerName;
      render();
    });
    detailsCard.appendChild(form);
    wrap.appendChild(detailsCard);

    var spCard = el('div', { class: 'card', style: 'padding:18px;margin-bottom:20px;' });
    spCard.appendChild(el('h3', { class: 'font-display', text: 'What you raise & grow', style: 'font-size:16px;font-weight:600;margin-bottom:4px;' }));
    spCard.appendChild(el('p', { text: 'Turn off anything you don\u2019t keep. Existing records stay saved, just hidden from the menu.', style: 'font-size:13px;color:var(--ink-soft);margin-bottom:12px;' }));

    function enterpriseToggleGrid(list) {
      var grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;' });
      list.forEach(function(sp) {
        var active = state.farm.speciesIds.indexOf(sp.id) > -1;
        var count = state.animals.filter(function(a) { return a.speciesId === sp.id; }).length;
        var btn = el('button', { style: 'display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid ' + (active ? 'var(--primary)' : 'var(--border)') + ';background:' + (active ? 'rgba(47,74,56,0.08)' : '#fff') + ';text-align:left;' });
        btn.appendChild(el('span', { text: sp.icon, style: 'font-size:18px;' }));
        var textWrap = el('div', {});
        textWrap.appendChild(el('p', { text: sp.label, style: 'font-size:13px;font-weight:600;' }));
        textWrap.appendChild(el('p', { text: active ? 'Tracking' : (count > 0 ? count + ' record(s) hidden' : 'Not tracked'), style: 'font-size:11px;color:var(--ink-soft);' }));
        btn.appendChild(textWrap);
        btn.addEventListener('click', function() {
          if (active) {
            if (count > 0 && !window.confirm('Hide ' + sp.label + '? Its ' + count + ' record(s) will stay saved but won\u2019t show in the menu until you turn it back on.')) return;
            state.farm.speciesIds = state.farm.speciesIds.filter(function(id) { return id !== sp.id; });
          } else {
            state.farm.speciesIds.push(sp.id);
          }
          render();
        });
        grid.appendChild(btn);
      });
      return grid;
    }

    spCard.appendChild(el('p', { class: 'eyebrow', text: 'Livestock', style: 'margin-bottom:8px;' }));
    spCard.appendChild(enterpriseToggleGrid(SPECIES));
    spCard.appendChild(el('p', { class: 'eyebrow', text: 'Crops', style: 'margin:16px 0 8px;' }));
    spCard.appendChild(enterpriseToggleGrid(CROPS));
    wrap.appendChild(spCard);

    var dataCard = el('div', { class: 'card', style: 'padding:18px;' });
    dataCard.appendChild(el('h3', { class: 'font-display', text: 'Your data', style: 'font-size:16px;font-weight:600;margin-bottom:4px;' }));
    dataCard.appendChild(el('p', { text: 'Everything you enter is saved automatically to your account. Keep a backup file whenever you like.', style: 'font-size:13px;color:var(--ink-soft);margin-bottom:14px;' }));
    var dataBtns = el('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;' });
    var exportBtn = el('button', { class: 'btn-outline', text: 'Export backup (.json)' });
    exportBtn.addEventListener('click', function() {
      var blob = new Blob([JSON.stringify(serializableState(), null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = (state.farm.farmName || 'farm').replace(/\s+/g, '-').toLowerCase() + '-backup-' + todayStr() + '.json';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    var importLabel = el('label', { class: 'btn-outline', text: 'Import backup (.json)', style: 'display:inline-block;' });
    var importInput = el('input', { type: 'file', accept: 'application/json', style: 'display:none;' });
    importLabel.appendChild(importInput);
    importInput.addEventListener('change', function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var data = JSON.parse(reader.result);
          if (!window.confirm('Replace all current data with this backup?')) return;
          Object.assign(state, data);
          render();
        } catch (err) { alert('That file could not be read as a farm backup.'); }
      };
      reader.readAsText(file);
    });
    var resetBtn = el('button', { class: 'btn-outline', text: 'Clear all data', style: 'color:var(--alert);border-color:rgba(166,67,47,0.4);' });
    resetBtn.addEventListener('click', function() {
      if (!window.confirm('This clears everything you\u2019ve entered and starts fresh. Continue?')) return;
      state.counters = {};
      state.farm.speciesIds = DEFAULT_SPECIES_IDS.slice();
      var seed = seedData(DEFAULT_SPECIES_IDS);
      state.animals = seed.animals; state.issues = seed.issues; state.compliance = seed.compliance;
      state.inspections = seed.inspections; state.securityChecks = seed.securityChecks; state.stockItems = seed.stockItems; state.stockMoves = seed.stockMoves;
      state.farmFinance = seed.farmFinance;
      state.workers = seed.workers; state.contacts = seed.contacts; state.grazingLogs = seed.grazingLogs;
      state.waterLogs = seed.waterLogs; state.loadSheddingLogs = seed.loadSheddingLogs;
      render();
    });
    dataBtns.appendChild(exportBtn); dataBtns.appendChild(importLabel); dataBtns.appendChild(resetBtn);
    dataCard.appendChild(dataBtns);
    wrap.appendChild(dataCard);

    return wrap;
  }

  function addDemoVegetablePlots() {
    state.animals.push({
      id: nextId('veg'), speciesId: 'vegetables', tracking: 'crop', createdAt: '2026-06-01',
      name: 'Tomato bed 2', breed: 'Roma', count: 3, status: 'growing', yieldKg: null,
      events: [
        { id: nextId('evt'), date: '2026-07-10', type: 'care', note: 'Fertilised with compost, staked plants' },
        { id: nextId('evt'), date: '2026-06-20', type: 'care', note: 'Transplanted seedlings' }
      ],
      finance: [{ id: nextId('fin'), date: '2026-06-15', type: 'expense', label: 'Seedlings and compost', amount: -260 }]
    });
    state.animals.push({
      id: nextId('veg'), speciesId: 'vegetables', tracking: 'crop', createdAt: '2026-06-01',
      name: 'Spinach bed 1', breed: 'Swiss chard', count: 2, status: 'ready', yieldKg: 18,
      events: [{ id: nextId('evt'), date: '2026-08-02', type: 'harvest', note: 'First harvest — 18kg, sold at local market' }],
      finance: [{ id: nextId('fin'), date: '2026-08-02', type: 'income', label: 'Spinach sold at market', amount: 340 }]
    });
  }

  // ---------- Boot ----------
  setIndicator('loading');
  loadState().then(function(found) {
    if (!found) {
      var seed = seedData(state.farm.speciesIds);
      state.animals = seed.animals; state.issues = seed.issues; state.compliance = seed.compliance;
      state.inspections = seed.inspections; state.securityChecks = seed.securityChecks; state.stockItems = seed.stockItems; state.stockMoves = seed.stockMoves;
      state.farmFinance = seed.farmFinance;
      state.workers = seed.workers; state.contacts = seed.contacts; state.grazingLogs = seed.grazingLogs;
      state.waterLogs = seed.waterLogs; state.loadSheddingLogs = seed.loadSheddingLogs;
    }
    if (!state.securityChecks) state.securityChecks = [];
    if (!state.meta) state.meta = {};
    if (!state.workers) state.workers = [];
    if (!state.contacts) state.contacts = [];
    if (!state.grazingLogs) state.grazingLogs = [];
    if (!state.waterLogs) state.waterLogs = [];
    if (!state.loadSheddingLogs) state.loadSheddingLogs = [];
    render();
    fetchWeather();
  });
})();
</script>
</body>
</html>
